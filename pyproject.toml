[project]
name = "glucy-ml"
version = "0.0.1"
description = "Entrenamiento y validación del modelo predictivo de Glucy"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E, F: errores y pyflakes. I: orden de los imports. UP: modernizaciones. B: trampas comunes.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
