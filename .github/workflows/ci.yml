# Integración continua de glucy-ml.
# Corre en cada pull request y en cada push a main y develop. Nada se fusiona con esto en rojo.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  pruebas:
    name: Estilo y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Revisar el estilo
        run: ruff check .

      - name: Correr las pruebas
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            pytest
          else
            echo "Todavía no hay pruebas en este repositorio."
          fi
